<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 Kids Learning Adventure 🌟</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--p:#6d28d9;--pink:#ec4899;--green:#10b981;--red:#ef4444}
html,body{height:100%;overflow:hidden;font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif}
body{background:linear-gradient(135deg,#dff5ff,#eee7ff 48%,#fff0bd);color:#334155}

.app{display:grid;grid-template-columns:200px 1fr;height:100vh;gap:8px;padding:8px}
.sidebar{background:linear-gradient(180deg,#fff 0%,#fef3ff 100%);border-radius:22px;padding:10px 8px;
  box-shadow:0 10px 30px #4c1d9528;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.logo{text-align:center;font-size:.78rem;font-weight:900;color:var(--p);padding:7px;
  background:linear-gradient(90deg,#fde68a,#fbcfe8);border-radius:14px;line-height:1.15;flex-shrink:0}
.menu-btn{border:0;border-radius:16px;padding:10px 10px;font-family:inherit;font-weight:900;font-size:.76rem;
  cursor:pointer;display:flex;flex-direction:row;align-items:center;gap:8px;transition:.25s;
  color:#fff;text-shadow:0 1px 2px #0003;box-shadow:0 5px 14px #0002;text-align:left;flex-shrink:0}
.menu-btn .ico{font-size:1.35rem;line-height:1;flex-shrink:0}
.menu-btn:hover{transform:translateY(-2px) scale(1.03)}
.menu-btn.active{transform:scale(1.05);box-shadow:0 0 0 3px #fbbf24,0 8px 20px #0003}
.menu-btn[data-tab="hindi"]{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.menu-btn[data-tab="add"]{background:linear-gradient(135deg,#34d399,#059669)}
.menu-btn[data-tab="sub"]{background:linear-gradient(135deg,#fb7185,#e11d48)}
.menu-btn[data-tab="mul"]{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.menu-btn[data-tab="div"]{background:linear-gradient(135deg,#38bdf8,#0284c7)}
.menu-btn[data-tab="tables"]{background:linear-gradient(135deg,#f472b6,#db2777)}
.menu-btn[data-tab="tblPractice"]{background:linear-gradient(135deg,#c084fc,#7e22ce)}
.menu-btn[data-tab="abc"]{background:linear-gradient(135deg,#fb923c,#ea580c)}
.menu-btn[data-tab="typing"]{background:linear-gradient(135deg,#22d3ee,#0891b2)}
.menu-btn[data-tab="help"]{background:linear-gradient(135deg,#94a3b8,#475569)}
.menu-btn[data-tab="request"]{background:linear-gradient(135deg,#facc15,#ca8a04)}

.main{background:#fffffff2;border:3px solid #fff;border-radius:22px;box-shadow:0 12px 35px #4c1d9528;
  padding:10px 14px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.topbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.stat{background:#ffffffcc;border-radius:12px;padding:5px;text-align:center;box-shadow:0 3px 10px #0001}
.stat small{display:block;font-size:.58rem;font-weight:800;color:#64748b}
.stat b{color:var(--p);font-size:1rem}
.progress{height:8px;border-radius:10px;background:#e2e8f0;overflow:hidden;margin-bottom:6px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--p),#0ea5e9);transition:.4s}
.panel{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;position:relative}

.toolbar{display:flex;gap:6px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:6px;
  font-size:.7rem;font-weight:900}
.toolbar .group{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.toolbar button{border:2px solid #ddd6fe;background:#fff;color:#6d28d9;border-radius:10px;
  padding:4px 9px;cursor:pointer;font-family:inherit;font-weight:900;font-size:.68rem;transition:.2s}
.toolbar button.active{background:linear-gradient(90deg,#7c3aed,#ec4899);color:#fff;border-color:transparent}
.toolbar .label{color:#64748b;font-size:.65rem}

.voice-status{display:inline-flex;align-items:center;gap:4px;background:#f0fdf4;border:2px solid #86efac;
  color:#166534;padding:3px 8px;border-radius:20px;font-size:.65rem;font-weight:900;transition:.2s;white-space:nowrap}
.voice-status.speaking{background:#fef3c7;border-color:#fbbf24;color:#92400e;animation:pulse 1s infinite}
.voice-status.error{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.voice-banner{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  background:linear-gradient(90deg,#fef3c7,#fde68a);border:3px solid #f59e0b;
  border-radius:14px;padding:10px 18px;font-size:.85rem;font-weight:900;color:#78350f;
  box-shadow:0 8px 24px #f59e0b44;z-index:50;text-align:center;max-width:90%;
  animation:slideDown .4s ease-out;
}
@keyframes slideDown{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

.play{width:100%;max-width:750px;display:flex;flex-direction:column;gap:6px;align-items:center}
.instruction{margin:0;color:var(--pink);font-size:.72rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;text-align:center}
.qbox{background:linear-gradient(135deg,#fef3c7,#fbcfe8);border-radius:22px;padding:10px 26px;min-height:110px;
  display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:inset 0 -5px 0 #0000000d;width:100%;
  transition:transform .3s, background .3s}
.qbox.flash-ok{background:linear-gradient(135deg,#a7f3d0,#6ee7b7);animation:boxPulse .6s}
.qbox.flash-bad{background:linear-gradient(135deg,#fecaca,#fca5a5);animation:boxPulse .5s}
@keyframes boxPulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.qtext{font-size:clamp(2.8rem,10vh,5.4rem);font-weight:900;color:var(--p);line-height:1;
  text-shadow:0 3px #ddd6fe;text-align:center;transition:.3s}
.mascot{font-size:clamp(2.4rem,7vh,4rem);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}

.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.small-btn{border:2px solid #bae6fd;background:#f0f9ff;color:#0369a1;border-radius:12px;padding:6px 12px;
  font-family:inherit;font-weight:900;font-size:.72rem;cursor:pointer;transition:.2s}
.small-btn.hint{border-color:#fde68a;background:#fffbeb;color:#b45309}
.small-btn.speak{border-color:#a7f3d0;background:#ecfdf5;color:#047857}
.small-btn:hover{transform:scale(1.06)}
.hint-line{min-height:16px;font-size:.75rem;color:#b45309;font-weight:800;text-align:center}
.answer-row{width:100%;display:grid;grid-template-columns:1fr 160px;gap:8px}
#answer{width:100%;border:3px solid #ddd6fe;border-radius:14px;padding:10px;text-align:center;
  font-size:1.5rem;font-weight:900;outline:none;color:#312e81;background:#fff;font-family:inherit;transition:.3s}
#answer:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px #ede9fe}
#answer.ok{border-color:#34d399;background:#ecfdf5;animation:okPulse .6s}
#answer.bad{border-color:#fb7185;background:#fff1f2;animation:shake .3s 2}
@keyframes okPulse{0%{transform:scale(1)}50%{transform:scale(1.06);box-shadow:0 0 0 8px #34d39933}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.check{border:0;border-radius:14px;color:#fff;font-weight:900;font-size:.9rem;
  background:linear-gradient(90deg,var(--p),var(--pink));cursor:pointer;font-family:inherit;padding:12px;transition:.2s}
.check:hover{transform:scale(1.04)}
.message{height:24px;font-weight:900;font-size:.9rem;text-align:center}
.success{color:var(--green)}
.error{color:var(--red)}

.plus-one{
  position:fixed;font-size:1.8rem;font-weight:900;color:#10b981;
  pointer-events:none;z-index:150;text-shadow:0 2px 6px #fff,0 0 12px #34d399;
  animation:plusFloat 1.1s ease-out forwards;
}
@keyframes plusFloat{
  0%{transform:translateY(0) scale(.5);opacity:0}
  20%{transform:translateY(-10px) scale(1.3);opacity:1}
  100%{transform:translateY(-90px) scale(1);opacity:0}
}
.play.slide-out{animation:slideOut .35s ease-in forwards}
@keyframes slideOut{to{transform:translateX(-40px);opacity:0}}
.play.slide-in{animation:slideIn .35s ease-out}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}

.tables-wrap{width:100%;text-align:center}
.tables-title{font-size:1.25rem;color:var(--p);font-weight:900;margin-bottom:6px}
.table-chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:10px}
.chip{background:linear-gradient(135deg,#f9a8d4,#db2777);color:#fff;border:0;border-radius:11px;
  padding:7px 12px;font-weight:900;font-family:inherit;cursor:pointer;font-size:.8rem;transition:.2s;
  box-shadow:0 4px 10px #db277733}
.chip:hover{transform:translateY(-2px) scale(1.08)}
.chip.active{background:linear-gradient(135deg,#fbbf24,#f59e0b);transform:scale(1.12)}
.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px;width:100%;padding:4px}
.tbl-cell{background:#fff;border:2px solid #e9d5ff;border-radius:11px;padding:7px;font-weight:900;
  font-size:.92rem;color:#4c1d95;cursor:pointer;transition:.15s;text-align:center}
.tbl-cell:hover{background:#faf5ff;transform:scale(1.05);border-color:#a78bfa}
.tbl-cell.speaking{background:#fef3c7;transform:scale(1.08)}

.practice-row{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #e9d5ff;
  border-radius:12px;padding:6px 10px;transition:.3s}
.practice-row.active{box-shadow:0 0 0 3px #a78bfa, 0 6px 18px #7c3aed33;transform:scale(1.02)}
.practice-row.solved{background:linear-gradient(90deg,#ecfdf5,#d1fae5);border-color:#10b981}
.practice-q{font-weight:900;color:#4c1d95;font-size:1rem}
.practice-blank{width:70px;border:2px dashed #c084fc;border-radius:8px;padding:5px;text-align:center;
  font-weight:900;font-size:1rem;font-family:inherit;color:#7c3aed;outline:none;transition:.25s}
.practice-blank:focus{border-style:solid;border-color:#7c3aed;background:#faf5ff;transform:scale(1.08)}
.practice-blank.ok{border-color:#10b981;background:#ecfdf5;border-style:solid;animation:okPulse .5s}
.practice-blank.bad{border-color:#ef4444;background:#fff1f2;border-style:solid;animation:shake .3s 2}

.abc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;width:100%;padding:4px}
.abc-card{background:linear-gradient(160deg,#fff,#fef3c7);border:3px solid #fbbf24;border-radius:16px;
  padding:8px;text-align:center;cursor:pointer;transition:.25s;box-shadow:0 5px 14px #fbbf2444}
.abc-card:hover{transform:translateY(-4px) rotate(-2deg) scale(1.05)}
.abc-emoji{font-size:2.4rem;line-height:1;display:block}
.abc-letter{font-size:1.8rem;font-weight:900;color:var(--p);margin-top:2px;font-family:'Noto Sans Devanagari',sans-serif}
.abc-word{font-size:.75rem;font-weight:800;color:#b45309}

.typing-menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;width:100%;max-width:1100px;padding:8px}
.typing-card{background:linear-gradient(160deg,#fff,#e0f2fe);border:3px solid #38bdf8;border-radius:18px;
  padding:14px;cursor:pointer;text-align:center;transition:.25s;box-shadow:0 6px 18px #38bdf844}
.typing-card:hover{transform:translateY(-5px) scale(1.04);border-color:#0284c7}
.typing-card .ic{font-size:2.6rem;display:block;margin-bottom:6px}
.typing-card h3{color:#0369a1;font-size:1rem;margin-bottom:4px}
.typing-card p{font-size:.72rem;color:#0c4a6e;font-weight:700}

.typing-stage{width:100%;max-width:900px;display:flex;flex-direction:column;gap:10px;align-items:center;position:relative}
.game-title{font-size:1.05rem;font-weight:900;color:#0369a1;background:#e0f2fe;border-radius:12px;padding:6px 14px;text-align:center}
.game-instructions{background:#fef3c7;border:2px dashed #f59e0b;border-radius:12px;padding:8px 14px;
  font-size:.8rem;font-weight:800;color:#78350f;text-align:center;max-width:600px;line-height:1.5}
.game-hud{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:.78rem;font-weight:900;color:#0c4a6e}
.game-hud span{background:#fff;border-radius:10px;padding:4px 10px;box-shadow:0 3px 10px #0001}

.stairs{position:relative;width:100%;height:340px;background:linear-gradient(180deg,#bae6fd,#ecfdf5);
  border-radius:18px;overflow:hidden;box-shadow:inset 0 -6px 0 #00000010}
.stair{position:absolute;background:linear-gradient(180deg,#fbbf24,#d97706);border-radius:6px;
  box-shadow:0 4px 10px #0003;display:flex;align-items:center;justify-content:center;color:#fff;
  font-weight:900;font-size:.65rem;transition:background .35s;text-shadow:0 1px 2px #0004}
.stair.done{background:linear-gradient(180deg,#86efac,#16a34a)}
.monkey{position:absolute;font-size:2.6rem;transition:left .5s cubic-bezier(.34,1.56,.64,1),bottom .5s cubic-bezier(.34,1.56,.64,1);
  z-index:5;filter:drop-shadow(0 4px 6px #0003);transform:scaleX(-1)}
.monkey.jump{animation:mjump .55s ease}
@keyframes mjump{0%{transform:translateY(0) scaleX(-1)}50%{transform:translateY(-30px) scaleX(-1) scale(1.15)}100%{transform:translateY(0) scaleX(-1)}}
.target-word{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px;background:#fff;
  border-radius:14px;box-shadow:0 4px 14px #0001;min-height:60px;align-items:center}
.target-letter{font-size:2rem;font-weight:900;color:#94a3b8;padding:4px 10px;border-radius:8px;
  transition:.25s;font-family:'Courier New',monospace}
.target-letter.active{color:#0ea5e9;background:#e0f2fe;transform:scale(1.2)}
.target-letter.typed{color:#16a34a;background:#dcfce7}
.target-letter.wrong{color:#e11d48;animation:shake .3s 2}

.fall-area{position:relative;width:100%;height:340px;background:linear-gradient(180deg,#1e293b,#0f172a);
  border-radius:18px;overflow:hidden;box-shadow:inset 0 0 40px #0006}
.starfield{position:absolute;inset:0;background-image:
  radial-gradient(1px 1px at 20% 30%,#fff,transparent),
  radial-gradient(1px 1px at 60% 70%,#fff,transparent),
  radial-gradient(1px 1px at 80% 20%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 40% 50%,#fff,transparent),
  radial-gradient(1px 1px at 90% 80%,#fff,transparent);opacity:.6}
.fall-item{position:absolute;font-size:2rem;font-weight:900;color:#fff;
  font-family:'Courier New',monospace;text-shadow:0 0 12px #38bdf8}
.basket{position:absolute;bottom:6px;width:70px;height:40px;background:linear-gradient(180deg,#fbbf24,#d97706);
  border-radius:0 0 30px 30px;box-shadow:0 6px 14px #0006;left:50%;transform:translateX(-50%);transition:left .18s}
.basket::before{content:"🧺";position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:2.2rem}

.balloon-area{position:relative;width:100%;height:340px;background:linear-gradient(180deg,#bae6fd,#fef3c7);
  border-radius:18px;overflow:hidden}
.balloon{position:absolute;font-size:2.6rem;cursor:pointer;animation:floatUp 6s linear infinite;
  text-align:center;user-select:none;transition:.25s}
.balloon .lbl{font-size:.9rem;font-weight:900;color:#fff;background:#7c3aed;border-radius:50%;
  width:22px;height:22px;line-height:22px;position:absolute;top:4px;left:50%;transform:translateX(-50%)}
.balloon.pop{animation:none;transform:scale(1.8);opacity:0;transition:.3s}
@keyframes floatUp{0%{transform:translateY(0)}100%{transform:translateY(-380px)}}

.race-area{position:relative;width:100%;height:340px;background:linear-gradient(180deg,#fef3c7,#fce7f3);
  border-radius:18px;overflow:hidden;padding:14px}
.race-track{position:relative;height:50px;background:#fff8;border-radius:22px;margin-bottom:8px;
  overflow:hidden;box-shadow:inset 0 2px 4px #0001}
.race-runner{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:1.8rem;transition:left .35s}
.race-finish{position:absolute;right:0;top:0;bottom:0;width:6px;background:#e11d48}

.speech-bubble{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;
  border:3px solid #38bdf8;border-radius:14px;padding:6px 14px;font-weight:900;color:#0369a1;
  font-size:.9rem;box-shadow:0 6px 18px #0002;z-index:6;display:none}
.speech-bubble.show{display:block;animation:pop .3s}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

.cargo-track{position:relative;width:100%;height:230px;background:linear-gradient(180deg,#bae6fd,#ecfdf5);
  border-radius:18px;overflow:hidden;padding-top:12px}
.train-line{position:absolute;bottom:30px;left:0;right:0;height:8px;
  background:repeating-linear-gradient(90deg,#94a3b8,#94a3b8 20px,#64748b 20px,#64748b 40px)}
.train{position:absolute;bottom:34px;font-size:2.8rem;transition:left .6s cubic-bezier(.34,1.56,.64,1);z-index:4}

.rocket-area{position:relative;width:100%;height:340px;background:linear-gradient(180deg,#0f172a,#1e293b);
  border-radius:18px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.rocket-stars{position:absolute;inset:0;background-image:
  radial-gradient(1.5px 1.5px at 15% 20%,#fff,transparent),
  radial-gradient(1px 1px at 45% 60%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 75% 30%,#fff,transparent),
  radial-gradient(1px 1px at 90% 70%,#fff,transparent),
  radial-gradient(1px 1px at 30% 90%,#fff,transparent);opacity:.8;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:.8}50%{opacity:.4}}
.rocket{font-size:3rem;position:absolute;bottom:20px;transition:bottom .6s cubic-bezier(.34,1.56,.64,1);
  filter:drop-shadow(0 0 12px #f59e0b)}
.rocket.flame::after{content:"🔥";position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:1.4rem;animation:flicker .15s infinite}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.6}}
.rocket-track{position:absolute;left:0;right:0;top:0;height:100%;
  background:linear-gradient(90deg,transparent 49%,#f59e0b33 49%,#f59e0b33 51%,transparent 51%)}
.rocket-goal{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:2rem}

.egg-area{position:relative;width:100%;min-height:220px;background:linear-gradient(180deg,#fef3c7,#fce7f3);
  border-radius:18px;overflow:hidden;padding:20px;text-align:center}
.egg-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.egg{font-size:2.6rem;cursor:pointer;transition:.3s;position:relative}
.egg.cracked{animation:crack .5s forwards}
@keyframes crack{0%{transform:scale(1)}50%{transform:scale(1.3) rotate(15deg)}100%{transform:scale(0) rotate(180deg);opacity:0}}
.egg .lbl{position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  background:#f59e0b;color:#fff;font-size:.7rem;font-weight:900;border-radius:6px;padding:1px 6px}

.word-drop{position:relative;width:100%;height:340px;background:linear-gradient(180deg,#bae6fd,#a7f3d0);
  border-radius:18px;overflow:hidden;padding:8px}
.drop-word{position:absolute;font-size:1.1rem;font-weight:900;color:#0369a1;background:#fff;
  padding:4px 10px;border-radius:10px;box-shadow:0 4px 10px #0002}
.drop-input{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  width:220px;padding:10px;font-size:1.1rem;text-align:center;border:3px solid #0ea5e9;border-radius:12px;
  font-family:'Courier New',monospace;font-weight:900;outline:none;background:#fff;text-transform:uppercase}

.color-typing{width:100%;text-align:center}
.color-swatch{font-size:5rem;margin:10px 0;animation:bob 1.6s infinite}
.color-name{font-size:1.5rem;font-weight:900;color:#0369a1;margin-bottom:12px;
  font-family:'Courier New',monospace;letter-spacing:3px}
.color-typing input{width:70%;padding:12px;font-size:1.4rem;text-align:center;font-weight:900;
  border:3px solid #0ea5e9;border-radius:14px;outline:none;font-family:'Courier New',monospace;text-transform:uppercase}
.color-typing input:focus{border-color:#7c3aed;box-shadow:0 0 0 4px #a78bfa44}

.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:600px;padding:8px}
.memory-card{aspect-ratio:1;background:linear-gradient(160deg,#7c3aed,#ec4899);border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;font-weight:900;
  cursor:pointer;transition:.35s;user-select:none;box-shadow:0 6px 18px #7c3aed44}
.memory-card:hover{transform:translateY(-3px) scale(1.03)}
.memory-card.flipped{background:linear-gradient(160deg,#fff,#fef3c7);color:#7c3aed;border:3px solid #fbbf24}
.memory-card.matched{background:linear-gradient(160deg,#86efac,#16a34a);color:#fff;pointer-events:none}

.help-wrap{max-width:720px;text-align:left;padding:8px 12px}

/* =========================================================
   🛑 AUDIO KILL SWITCH — stops all pending audio + speech
   Called on every button click / tab switch / game change
   ========================================================= */
let pendingAudioTimers = [];   // setTimeout ids for scheduled tones
let pendingAnimFrames = [];    // requestAnimationFrame ids for scheduled anims

/* Wrapped setTimeout that registers itself so killAllAudio() can clear it */
function safeTimeout(fn, ms){
  const id = setTimeout(()=>{
    pendingAudioTimers = pendingAudioTimers.filter(t=>t!==id);
    try{ fn(); }catch(e){}
  }, ms);
  pendingAudioTimers.push(id);
  return id;
}
function clearAllPendingTimers(){
  pendingAudioTimers.forEach(id=>{ try{ clearTimeout(id); }catch(e){} });
  pendingAudioTimers = [];
  pendingAnimFrames.forEach(id=>{ try{ cancelAnimationFrame(id); }catch(e){} });
  pendingAnimFrames = [];
}

/* THE MAIN FUNCTION — kills ALL audio */
function killAllAudio(){
  // 1. Stop all speech synthesis
  if("speechSynthesis" in window){
    try{ speechSynthesis.cancel(); }catch(e){}
  }
  // 2. Clear all scheduled tone timers
  clearAllPendingTimers();
  // 3. Stop all currently playing oscillators
  stopAllOscillators();
  // 4. Reset voice status pill
  if(voicesReady) updateVoiceStatusFromAll();
}

/* Keep track of live oscillators so we can stop them */
let liveOscillators = new Set();
const _origCreateOscillator = null; // placeholder

function stopAllOscillators(){
  liveOscillators.forEach(osc=>{
    try{ osc.stop(0); }catch(e){}
  });
  liveOscillators.clear();
}

/* =========================================================
   SOUND ENGINE
   ========================================================= */
let audioCtx=null;
let soundOn=true, voiceOn=true, natureOn=true;
let voiceStyle="mix";

function ac(){
  if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}

/* Tone — registers oscillator in liveOscillators so we can stop it */
function tone(freq,dur=0.15,type="sine",vol=0.15,when=0,slideTo=null){
  if(!soundOn)return;
  const c=ac(); if(!c)return;
  const t0=c.currentTime+when;
  const osc=c.createOscillator(), g=c.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,t0);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g); g.connect(c.destination);
  liveOscillators.add(osc);
  osc.onended = ()=>{ liveOscillators.delete(osc); };
  osc.start(t0); osc.stop(t0+dur+0.05);
}

function noise(dur=0.2,vol=0.1,filtFreq=2000,type="bandpass"){
  if(!soundOn)return;
  const c=ac(); if(!c)return;
  const n=Math.floor(c.sampleRate*dur);
  const buf=c.createBuffer(1,n,c.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=c.createBufferSource(); src.buffer=buf;
  const flt=c.createBiquadFilter(); flt.type=type; flt.frequency.value=filtFreq;
  const g=c.createGain();
  g.gain.setValueAtTime(vol,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
  src.connect(flt); flt.connect(g); g.connect(c.destination);
  src.start(); src.stop(c.currentTime+dur);
}

function birdChu(){ if(!soundOn)return; const b=1600+Math.random()*400;
  tone(b,.06,"sine",.12,0); tone(b+300,.06,"sine",.12,.09); tone(b+500,.08,"sine",.12,.18); }
function birdChuLong(){ if(!soundOn)return; const b=1500+Math.random()*500;
  [0,.08,.16,.28].forEach((t,i)=>tone(b+i*250,.05,"sine",.11,t)); }
function tigerRoar(){ if(!soundOn)return; const c=ac(); if(!c)return; const t0=c.currentTime;
  const osc=c.createOscillator(), g=c.createGain(), flt=c.createBiquadFilter();
  flt.type="lowpass"; flt.frequency.value=900; osc.type="sawtooth";
  osc.frequency.setValueAtTime(110,t0);
  osc.frequency.linearRampToValueAtTime(140,t0+.3);
  osc.frequency.linearRampToValueAtTime(90,t0+.7);
  g.gain.setValueAtTime(0.0001,t0);

  liveOscillators.add(osc);
  osc.onended=()=>liveOscillators.delete(osc);

/* =========================================================
   HUMAN VOICE
   ========================================================= */
const voicePresets={
  female:{rate:0.92, pitch:1.30, label:"👩 Female"},
  male:{rate:0.88, pitch:0.80, label:"👨 Male"},
  child:{rate:1.00, pitch:1.60, label:"🧒 Child"}
};

let allVoices = [];
let voicesReady = false;
let voiceEngineUnlocked = false;

function loadVoicesAsync(){
  return new Promise((resolve)=>{
    if(!("speechSynthesis" in window)){ resolve([]); return; }
    const check = ()=>{
      const v = speechSynthesis.getVoices();
      if(v && v.length > 0){ allVoices = v; voicesReady = true; resolve(v); return true; }
      return false;
    };
    if(check()) return;
    let resolved = false;
    const done = ()=>{ if(resolved) return; resolved=true; resolve(allVoices); };
    speechSynthesis.onvoiceschanged = ()=>{ if(check()){ updateVoiceStatusFromAll(); done(); } };
    let tries = 0;
    const iv = setInterval(()=>{
      if(check()){ updateVoiceStatusFromAll(); clearInterval(iv); done(); return; }
      if(++tries > 15){ clearInterval(iv); done(); }
    }, 250);
    setTimeout(()=>{ if(!resolved){ clearInterval(iv); done(); } }, 4000);
  });
}

function updateVoiceStatusFromAll(){
  const hi = allVoices.filter(v=>v.lang.toLowerCase().startsWith("hi")).length;
  const en = allVoices.filter(v=>v.lang.toLowerCase().startsWith("en")).length;
  const el = document.getElementById("voiceStatus");
  if(!el) return;
  el.textContent = `✅ ${allVoices.length} voices (hi:${hi} en:${en})`;
  el.classList.remove("error");
  el.classList.remove("speaking");
}
function updateVoiceStatus(txt, speaking, isError){
  const el = document.getElementById("voiceStatus");
  if(!el) return;
  el.textContent = txt;
  el.classList.toggle("speaking", !!speaking);
  el.classList.toggle("error", !!isError);
}

let bannerTimeout = null;
function showVoiceBanner(msg, duration=7000){
  const old = document.querySelector(".voice-banner");
  if(old) old.remove();
  const b = document.createElement("div");
  b.className = "voice-banner";
  b.innerHTML = msg;
  document.querySelector(".main").appendChild(b);
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(()=>b.remove(), duration);
}

function unlockVoiceEngine(){
  if(voiceEngineUnlocked) return;
  if(!("speechSynthesis" in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    u.rate = 2;
    speechSynthesis.speak(u);
    voiceEngineUnlocked = true;
  }catch(e){}
}

function pickVoiceStyle(){
  if(voiceStyle!=="mix") return voiceStyle;
  const a=["female","male","child"];
  return a[Math.floor(Math.random()*a.length)];
}

function pickBestVoice(text, requestedLang){
  if(!allVoices.length) return null;
  const isDevanagari = /[\u0900-\u097F]/.test(text);
  const tl = (requestedLang||"en").slice(0,2).toLowerCase();
  let v = allVoices.find(x=>x.lang.toLowerCase().startsWith(tl));
  if(v) return v;
  if(isDevanagari){
    v = allVoices.find(x=>x.lang.toLowerCase().startsWith("hi"));
    if(v) return v;
  }
  v = allVoices.find(x=>x.lang.toLowerCase().startsWith("en"));
  if(v) return v;
  return allVoices[0] || null;
}

function speak(text, lang, onend, forcedStyle){
  if(!voiceOn || !("speechSynthesis" in window)){
    if(onend) safeTimeout(onend, 30);
    return;
  }
  if(!voicesReady){
    loadVoicesAsync().then(()=>speak(text, lang, onend, forcedStyle));
    return;
  }
  try{ speechSynthesis.cancel(); }catch(e){}
  const key = forcedStyle || pickVoiceStyle();
  const preset = voicePresets[key];
  const useLang = lang || (appLang==="hi" ? "hi-IN" : "en-IN");
  const u = new SpeechSynthesisUtterance(text);
  u.lang = useLang;
  u.rate = preset.rate;
  u.pitch = preset.pitch;
  u.volume = 1.0;
  const v = pickBestVoice(text, useLang);

/* Table reader — registers its own loop timer so killAllAudio can stop it */
let tableReaderTimerId = null;
function readTableHuman(table, mode){
  killAllAudio(); // stop any prior reading
  const isHi = appLang==="hi";
  const op = mode==="mul" ? (isHi?"गुणा":"times") : (isHi?"जमा":"plus");
  const eq = isHi ? "बराबर" : "equals";
  let i=1;
  let cancelled = false;
  const ticks=[birdChu, waterDrop, frogCroak, birdChuLong, monkeyOoo];

  function nextLine(){
    if(cancelled) return;
    if(i>20){ fanfare(); updateVoiceStatusFromAll(); return; }
    const res = mode==="mul" ? table*i : table+i;
    const line = `${table} ${op} ${i} ${eq} ${res}`;
    const forced = ["female","male","child"][(i-1)%3];
    const style = voiceStyle==="mix" ? forced : voiceStyle;
    if(!voiceOn){
      try{ ticks[(i-1)%ticks.length](); }catch(e){}
      i++;
      tableReaderTimerId = safeTimeout(nextLine, 400);
      return;
    }
    speak(line, isHi?"hi-IN":"en-IN", ()=>{
      if(cancelled) return;
      try{ ticks[(i-1)%ticks.length](); }catch(e){}
      i++;
      tableReaderTimerId = safeTimeout(nextLine, 200);
    }, style);
  }
  /* Store cancel handle on the timer chain */
  readTableHuman.cancel = ()=>{ cancelled = true; };
  nextLine();
}

function speakChar(ch){
  speak(ch, /[\u0900-\u097F]/.test(ch) ? "hi-IN" : "en-IN", null, pickVoiceStyle());
}

function burst(x,y,n=50){
  const colors=["#f43f5e","#fbbf24","#10b981","#3b82f6","#a855f7","#ec4899","#22d3ee"];
  for(let i=0;i<n;i++){
    confetti.push({x,y,vx:(Math.random()-.5)*11,vy:Math.random()*-11-3,g:.35,life:85,
      color:colors[i%colors.length],size:Math.random()*8+4,rot:Math.random()*Math.PI});
  }
}
function animConfetti(){
  ctx2.clearRect(0,0,cvs.width,cvs.height);
  confetti=confetti.filter(p=>p.life>0);

    ctx2.save();ctx2.translate(p.x,p.y);ctx2.rotate(p.rot);
    ctx2.fillStyle=p.color;ctx2.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx2.restore();});
  requestAnimationFrame(animConfetti);
}

/* Math */
function rnd(max,min=1){return Math.floor(Math.random()*(max-min+1))+min}
function genMath(type){
  const hi=20; let a,b,q,ans;
  if(type==="add"){a=rnd(hi);b=rnd(hi);q=`${a} + ${b}`;ans=a+b;}
  else if(type==="sub"){a=rnd(hi);b=rnd(a);q=`${a} − ${b}`;ans=a-b;}
  else if(type==="mul"){a=rnd(10);b=rnd(10);q=`${a} × ${b}`;ans=a*b;}
  else if(type==="div"){b=rnd(10,2);ans=rnd(10,1);a=b*ans;q=`${a} ÷ ${b}`;}
  return {q,a:String(ans),type:type.toUpperCase()};
}
function buildLessons(){
  if(mode==="hindi") lessons=hindiLessons.map(x=>({q:x.q,a:x.a,type:x.type}));
  else if(mode==="add")lessons=Array.from({length:20},()=>genMath("add"));
  else if(mode==="sub")lessons=Array.from({length:20},()=>genMath("sub"));
  else if(mode==="mul")lessons=Array.from({length:20},()=>genMath("mul"));
  else if(mode==="div")lessons=Array.from({length:20},()=>genMath("div"));
  else lessons=[];
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* English helpers */
const ENGLISH_WORDS = ["CAT","DOG","SUN","BIRD","FISH","MOON","STAR","TREE","BOOK","MILK","FROG","LION","BEAR","DUCK","FIRE","GOLD","HOME","KING","LOVE","RAIN"];
const ENGLISH_LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
function randomEnglishWord(len){
  const w = ENGLISH_WORDS[Math.floor(Math.random()*ENGLISH_WORDS.length)];
  return len ? w.slice(0,len) : w;
}
function randomEnglishLetters(n){
  return Array.from({length:n},()=>ENGLISH_LETTERS[Math.floor(Math.random()*ENGLISH_LETTERS.length)]);
}

/* 1. Monkey Stairs */
function startMonkey(){
  const word = randomEnglishWord(5);
  typingState.idx=0; typingState.word=word; typingState.correct=0; typingState.wrong=0;
  const isHi = appLang==="hi";
  $("panel").innerHTML=`
    <div class="typing-stage">
      <div class="game-title">🐒 ${isHi?"बंदर की सीढ़ियाँ":"Monkey Stairs"}</div>
      <div class="game-instructions">${isHi?"👇 अक्षर टाइप करो → बंदर ऊपर चढ़ेगा!":"👇 Type the letter → monkey jumps up a step!"}</div>
      <div class="game-hud"><span>✅ <b id="mOK">0</b></span><span>❌ <b id="mBad">0</b></span><span>🎯 <b>${word}</b></span></div>
      <div class="stairs" id="stairs"><div class="speech-bubble" id="bubble">${isHi?"चलो! 🐒":"Let's start! 🐒"}</div></div>
      <div class="target-word" id="targetWord"></div>
      <button class="small-btn" id="back" style="align-self:flex-start">← ${isHi?"वापस":"Back"}</button>
    </div>`;
  $("back").onclick=()=>{ killAllAudio(); stopAllTyping(); renderTypingMenu(); };
  const stairs=$("stairs");
  const stepW=90, stepH=46;
  const gap = Math.max(4, (stairs.clientWidth - word.length*stepW - 40) / Math.max(1,word.length-1));
  for(let i=0;i<word.length;i++){
    const s=document.createElement("div");
    s.className="stair";
    s.style.cssText=`width:${stepW}px;height:${stepH}px;left:${15+i*(stepW+gap)}px;bottom:${i*stepH+10}px`;
    s.dataset.i=i; s.textContent=`STEP ${i+1}`;
    stairs.appendChild(s);
  }
  const monkey=document.createElement("div");
  monkey.className="monkey"; monkey.textContent="🐒";
  monkey.style.left="15px"; monkey.style.bottom="6px";
  stairs.appendChild(monkey);
  function renderTargetWord(){
    const tw=$("targetWord"); tw.innerHTML="";
    [...word].forEach((ch,i)=>{
      const el=document.createElement("span");
      el.className="target-letter"+(i<typingState.idx?" typed":"")+(i===typingState.idx?" active":"");
      el.textContent=ch; tw.appendChild(el);
    });
  }
  renderTargetWord();
  function showBubble(txt){
    const b=$("bubble"); b.textContent=txt; b.classList.remove("show");
    void b.offsetWidth; b.classList.add("show");
    clearTimeout(b._t); b._t=safeTimeout(()=>b.classList.remove("show"),1600);
  }
  typingState.keyHandler=(e)=>{
    if(e.key==="Escape"||e.ctrlKey||e.altKey||e.metaKey) return;
    if(e.key.length!==1) return;
    const typed = e.key.toUpperCase();
    if(typed===word[typingState.idx]){
      typingState.idx++; typingState.correct++;
      typeClick(); jumpSound();
      $("mOK").textContent=typingState.correct;
      speak(typed, "en-IN");
      const s=stairs.querySelector(`[data-i="${typingState.idx-1}"]`);
      if(s){
        monkey.style.left=(parseFloat(s.style.left)+stepW/2-14)+"px";
        monkey.style.bottom=(parseFloat(s.style.bottom)+stepH-6)+"px";
        monkey.classList.remove("jump"); void monkey.offsetWidth; monkey.classList.add("jump");
        s.classList.add("done");
      }
      showBubble(["Great! 🎉","Nice! 🌟","Super! ✅","Wow! 🐒"][Math.floor(Math.random()*4)]);
      renderTargetWord();
      if(typingState.idx>=word.length){
        safeTimeout(()=>winTyping(isHi?"🐒 शाबाश! बंदर ऊपर!":"🐒 Awesome! Monkey reached the top!"),500);
      }
    }else{
      typingState.wrong++; $("mBad").textContent=typingState.wrong;
      gentleTry();
      const act=document.querySelector(".target-letter.active");
      if(act){act.classList.add("wrong"); safeTimeout(()=>act.classList.remove("wrong"),400);}
      showBubble(isHi?"फिर कोशिश करो 🙈":"Try again 🙈");
    }
  };
  document.addEventListener("keydown",typingState.keyHandler);
}

/* 2. Falling Letters */
function startFalling(){
  const word = randomEnglishWord(4);
  typingState.idx=0; typingState.word=word; typingState.correct=0; typingState.wrong=0;
  typingState.items=[]; typingState.last=0; typingState.spawnEvery=1500;
  const isHi = appLang==="hi";
  $("panel").innerHTML=`
    <div class="typing-stage">
      <div class="game-title">🌠 ${isHi?"गिरते अक्षर":"Falling Letters"}</div>
      <div class="game-instructions">${isHi?"👇 गिरते अक्षर टाइप करके पकड़ो!":"👇 Type the falling letters to catch them!"}<br><b>🎯 ${word}</b></div>
      <div class="game-hud"><span>✅ <b id="fOK">0</b></span><span>❌ <b id="fBad">0</b></span></div>
      <div class="fall-area" id="fArea"><div class="starfield"></div><div class="basket" id="basket"></div></div>
      <button class="small-btn" id="back" style="align-self:flex-start">← ${isHi?"वापस":"Back"}</button>
    </div>`;
  $("back").onclick=()=>{ killAllAudio(); stopAllTyping(); renderTypingMenu(); };
  const area=$("fArea");
  const letters=[...new Set([...word, ...randomEnglishLetters(3)])];
  function spawnLetter(){
    const letter=letters[Math.floor(Math.random()*letters.length)];
    const el=document.createElement("div");
    el.className="fall-item"; el.textContent=letter;
    const x=20+Math.random()*Math.max(40, area.clientWidth-70);
    el.style.left=x+"px"; el.style.top="0px";
    area.appendChild(el);
    typingState.items.push({el,letter,x,y:0,vy:1.4+Math.random()*1.3,dead:false});
  }
  function loop(t){
    if(!typingState.word) return;
    if(t-typingState.last>typingState.spawnEvery){ typingState.last=t; spawnLetter(); }
    typingState.items.forEach(it=>{
      if(it.dead) return;
      it.y+=it.vy; it.el.style.top=it.y+"px";
      if(it.y>area.clientHeight-50){ it.dead=true; it.el.remove(); }
    });
    typingState.items=typingState.items.filter(i=>!i.dead);
    typingRAF=requestAnimationFrame(loop);
  }
  typingRAF=requestAnimationFrame(loop);
  typingState.keyHandler=(e)=>{
    if(e.key==="Escape"||e.ctrlKey||e.altKey||e.metaKey) return;
    if(e.key.length!==1) return;
    const typed = e.key.toUpperCase();
    const idx=typingState.items.findIndex(it=>it.letter===typed);
    if(idx>=0){
      const it=typingState.items[idx];
      it.dead=true; it.el.remove();
      typeClick(); sparkle(); popSound();
      const b=$("basket");
      b.style.left=Math.max(35, Math.min(area.clientWidth-35, it.x+20))+"px";
      speak(typed, "en-IN");
      if(typed===word[typingState.idx]){
        typingState.idx++; typingState.correct++;
        $("fOK").textContent=typingState.correct;
        if(typingState.idx>=word.length){
          safeTimeout(()=>winTyping(isHi?"🌟 सारे अक्षर पकड़े!":"🌟 You caught all letters!"),400);
        }
      }else{
        typingState.wrong++; $("fBad").textContent=typingState.wrong;
      }
    }else{ gentleTry(); }
  };
  document.addEventListener("keydown",typingState.keyHandler);
}

/* 3. Balloon Pop */
function startBalloon(){
  const target = rnd(10);
  typingState.target=target; typingState.score=0; typingState.bad=0;
  const isHi = appLang==="hi";
  $("panel").innerHTML=`
    <div class="typing-stage">
      <div class="game-title">🎈 ${isHi?"गुब्बारा फोड़ो":"Balloon Pop"}</div>
      <div class="game-instructions">${isHi?`👇 सही नंबर <b>${target}</b> वाला गुब्बारा क्लिक करो!`:`👇 Click balloons showing <b>${target}</b>! Get 5 to win!`}</div>
      <div class="game-hud"><span>✅ <b id="bOK">0</b></span><span>❌ <b id="bBad">0</b></span><span>🎯 <b>${target}</b></span></div>
      <div class="balloon-area" id="bArea"></div>
      <button class="small-btn" id="back" style="align-self:flex-start">← ${isHi?"वापस":"Back"}</button>
    </div>`;
  $("back").onclick=()=>{ killAllAudio(); stopAllTyping(); renderTypingMenu(); };
  const area=$("bArea");
  function spawn(){
    area.innerHTML="";
    const nums = shuffle([...new Set([target, rnd(10), rnd(10), rnd(10), rnd(10), rnd(10)])]);
    nums.forEach((n,i)=>{
      const b=document.createElement("div");
      b.className="balloon";
      b.style.left=(6 + i*(88/nums.length))+"%";
      b.style.bottom="20px";
      b.style.animationDelay=(Math.random()*2)+"s";
      b.innerHTML=`<span class="lbl">${n}</span>🎈`;
      b.onclick=()=>{
        if(b.classList.contains("pop")) return;
        if(n===target){
          b.classList.add("pop");
          typeClick(); popSound(); sparkle();
          typingState.score++; $("bOK").textContent=typingState.score;
          const r=b.getBoundingClientRect();
          burst(r.left+r.width/2, r.top+r.height/2, 25);
          speak(String(n), "en-IN");
          if(typingState.score>=5){
            safeTimeout(()=>winTyping(isHi?"🎈 शाबाश!":"🎈 Well done!"),400);
          }else{ safeTimeout(spawn, 600); }
        }else{
          typingState.bad++; $("bBad").textContent=typingState.bad;
          gentleTry(); b.style.opacity=".35";
        }
      };
      area.appendChild(b);
    });
  }
  spawn();
}

/* 4. Word Race */
function startRace(){
  const letters="ABCDEFGHIJ".split("");
  typingState.words=letters; typingState.idx=0; typingState.pos=0;
  const isHi = appLang==="hi"; const GOAL=10;
  $("panel").innerHTML=`
    <div class="typing-stage">
      <div class="game-title">🏁 ${isHi?"शब्द दौड़":"Word Race"}</div>
      <div class="game-instructions">${isHi?`👇 अक्षर टाइप करो → खरगोश दौड़ेगा! ${GOAL} अक्षर = जीत!`:`👇 Type the letter → your rabbit runs! ${GOAL} letters to win!`}</div>
      <div class="game-hud"><span>🏃 <b id="rPos">0</b>/${GOAL}</span><span>🎯 <b id="rWord">${letters[0]}</b></span></div>
      <div class="race-area" id="rArea"></div>
      <button class="small-btn" id="back" style="align-self:flex-start">← ${isHi?"वापस":"Back"}</button>
    </div>`;
  $("back").onclick=()=>{ killAllAudio(); stopAllTyping(); renderTypingMenu(); };
  function draw(){
    const area=$("rArea"); area.innerHTML="";
    [{e:"🐇",mine:true},{e:"🐢",mine:false},{e:"🦊",mine:false}].forEach((r,i)=>{
      const t=document.createElement("div"); t.className="race-track";
      const run=document.createElement("div"); run.className="race-runner"; run.textContent=r.e;
      const prog = r.mine ? typingState.pos : Math.min(GOAL, Math.floor(typingState.pos*(i===1?0.7:0.85)) + (Math.random()<0.3?1:0));
      run.style.left = (prog*(100/GOAL)) + "%";
      t.appendChild(run);
      const f=document.createElement("div"); f.className="race-finish"; t.appendChild(f);
      area.appendChild(t);
    });
  }
  draw();
  typingState.keyHandler=(e)=>{
    if(e.key==="Escape"||e.ctrlKey||e.altKey||e.metaKey) return;
    if(e.key.length!==1) return;
    const cur=letters[typingState.idx % letters.length];
    if(e.key.toUpperCase()===cur){
      typingState.idx++; typingState.pos++;
      typeClick(); sparkle(); jumpSound();
      speak(e.key.toUpperCase(), "en-IN");
      $("rPos").textContent=typingState.pos;
      if(typingState.pos>=GOAL){
        safeTimeout(()=>winTyping(isHi?"🏆 रेस जीत ली!":"🏆 You won the race!"),300); return;
      }
      $("rWord").textContent=letters[typingState.idx % letters.length];
      draw();
    }else{ gentleTry(); }
  };
  document.addEventListener("keydown",typingState.keyHandler);
}

/* 8. Word Drop */
function startDrop(){
  const words = ["CAT","DOG","SUN","BOOK","FISH","MOON","STAR","FROG","BEAR","LION"];
  typingState.queue = shuffle([...words]).slice(0,8);
  typingState.idx = 0; typingState.correct=0; typingState.wrong=0;
  typingState.items = [];
  const isHi = appLang==="hi";
  $("panel").innerHTML=`
    <div class="typing-stage">
      <div class="game-title">💧 ${isHi?"शब्द गिराव":"Word Drop"}</div>
      <div class="game-instructions">${isHi?"👇 गिरते शब्दों को नीचे बॉक्स में टाइप करके पकड़ो!":"👇 Type the falling word into the box at the bottom before it lands!"}</div>
      <div class="game-hud"><span>✅ <b id="dOK">0</b></span><span>❌ <b id="dBad">0</b></span><span>🎯 <b id="dTarget">${typingState.queue[0]}</b></span></div>
      <div class="word-drop" id="dArea">
        <input class="drop-input" id="dInput" placeholder="${isHi?'यहाँ टाइप करो...':'Type here...'}" autocomplete="off">
      </div>
      <button class="small-btn" id="back" style="align-self:flex-start">← ${isHi?"वापस":"Back"}</button>
    </div>`;
  $("back").onclick=()=>{ killAllAudio(); stopAllTyping(); renderTypingMenu(); };
  const area = $("dArea");
  const input = $("dInput"); input.focus();

  function spawnWord(){
    if(typingState.idx >= typingState.queue.length) return;
    const word = typingState.queue[typingState.idx];
    const el = document.createElement("div");
    el.className = "drop-word"; el.textContent = word;
    el.style.left = (10 + Math.random()*(area.clientWidth-140)) + "px";
    el.style.top = "-40px";
    area.appendChild(el);
    const dur = 7000 + Math.random()*2000;
    el.style.transition = `top ${dur}ms linear`;
    requestAnimationFrame(()=>{ el.style.top = (area.clientHeight - 80) + "px"; });
    typingState.items.push({el, word, done:false});
    safeTimeout(()=>{
      if(!el.parentNode) return;
      if(!el.dataset.caught){
        typingState.wrong++; $("dBad").textContent = typingState.wrong;
        gentleTry();
        el.remove();
        typingState.idx++;
        if(typingState.idx >= typingState.queue.length){ checkDropEnd(); }
        else { $("dTarget").textContent = typingState.queue[typingState.idx]; spawnWord(); }
      }
    }, dur + 100);
  }
  spawnWord();
  typingState.inputHandler = ()=>{
    input.value = input.value.toUpperCase().replace(/[^A-Z]/g,"");
    const target = typingState.queue[typingState.idx];
    if(input.value === target){
      const it = typingState.items.find(i=>!i.done && i.word === target);
      if(it){
        it.done = true; it.el.dataset.caught = "1";
        const r = it.el.getBoundingClientRect();
        burst(r.left+r.width/2, r.top, 25); sparkle();
        it.el.remove();
      }
      typingState.correct++; typingState.idx++;
      $("dOK").textContent = typingState.correct;
      input.value = "";
      if(typingState.idx >= typingState.queue.length){ checkDropEnd(); return; }
      $("dTarget").textContent = typingState.queue[typingState.idx];
      spawnWord();
    }
  };
  input.addEventListener("input", typingState.inputHandler);

  function checkDropEnd(){
    safeTimeout(()=>winTyping(isHi?"💧 शाबाश! सब शब्द पकड़े!":"💧 Awesome! All words caught!"),400);
  }
}

/* 9. Color Typing */
function startColor(){
  const colors = [
    {name:"RED", hex:"#ef4444", emoji:"🔴"},
    {name:"BLUE", hex:"#3b82f6", emoji:"🔵"},
    {name:"GREEN", hex:"#10b981", emoji:"🟢"},
    {name:"YELLOW", hex:"#fbbf24", emoji:"🟡"},
    {name:"PURPLE", hex:"#a855f7", emoji:"🟣"},
    {name:"ORANGE", hex:"#f97316", emoji:"🟠"},
    {name:"PINK", hex:"#ec4899", emoji:"🩷"},
    {name:"BLACK", hex:"#1e293b", emoji:"⚫"}
  ];
  typingState.queue = shuffle([...colors]).slice(0, 8);
  typingState.idx = 0; typingState.correct = 0; typingState.wrong = 0;
  const isHi = appLang==="hi";
  function render(){
    const cur = typingState.queue[typingState.idx];
    if(!cur){ winTyping(isHi?"🌈 सब रंग टाइप हो गए!":"🌈 All colors typed!"); return; }
    $("panel").innerHTML=`
      <div class="typing-stage">
        <div class="game-title">🌈 ${isHi?"रंग टाइपिंग":"Color Typing"}</div>
        <div class="game-instructions">${isHi?"👇 नीचे दिखा रंग का नाम English में टाइप करो, Enter दबाओ":"👇 Type the name of the color shown below, then press Enter"}</div>
        <div class="game-hud">
          <span>✅ <b id="cOK">${typingState.correct}</b></span>
          <span>❌ <b id="cBad">${typingState.wrong}</b></span>
          <span>🎯 <b>${typingState.idx+1}/${typingState.queue.length}</b></span>
        </div>
        <div class="color-typing">
          <div class="color-swatch" style="text-shadow:0 0 30px ${cur.hex}">${cur.emoji}</div>
          <div class="color-name" style="color:${cur.hex};text-shadow:0 2px 0 #fff,0 0 18px ${cur.hex}55">${cur.name}</div>
          <input id="cInput" autocomplete="off" placeholder="${isHi?'यहाँ लिखो...':'Type here...'}" style="text-transform:uppercase">
        </div>
        <button class="small-btn" id="back" style="align-self:flex-start">← ${isHi?"वापस":"Back"}</button>
      </div>`;
    $("back").onclick=()=>{ killAllAudio(); stopAllTyping(); renderTypingMenu(); };
    const input = $("cInput");
    input.focus();
    input.addEventListener("input", ()=>{ input.value = input.value.toUpperCase().replace(/[^A-Z]/g,""); typeClick(); });
    input.addEventListener("keydown", (e)=>{
      if(e.key !== "Enter") return;
      const cur2 = typingState.queue[typingState.idx];
      if(input.value === cur2.name){
        typingState.correct++;
        sparkle(); burst(innerWidth/2, innerHeight/2, 40); speak(cur2.name, "en-IN");
        typingState.idx++;
        render();
      } else {
        typingState.wrong++; gentleTry();
        input.classList.add("bad");
        safeTimeout(()=>input.classList.remove("bad"), 500);
      }
    });
  }
  render();
}

/* 10. Memory Match */
function startMemory(){
  const pairs = ["A","B","C","D","E","F","G","H"];
  const cards = shuffle([...pairs, ...pairs]);
  typingState.cards = cards;
  typingState.flipped = [];
  typingState.matched = 0;
  typingState.tries = 0;
  const isHi = appLang==="hi";
  $("panel").innerHTML=`
    <div class="typing-stage">
      <div class="game-title">🃏 ${isHi?"मेमरी मैच":"Memory Match"}</div>
      <div class="game-instructions">${isHi?"👇 कार्ड क्लिक करो। दो एक जैसे अक्षर मिलाओ!":"👇 Click cards. Match pairs of the same letter!"}</div>
      <div class="game-hud">
        <span>✅ <b id="mMatched">0</b>/8</span>
        <span>🔁 <b id="mTries">0</b></span>
      </div>
      <div class="memory-grid" id="memGrid"></div>
      <button class="small-btn" id="back" style="align-self:flex-start">← ${isHi?"वापस":"Back"}</button>
    </div>`;
  $("back").onclick=()=>{ killAllAudio(); stopAllTyping(); renderTypingMenu(); };
  const grid = $("memGrid");
  cards.forEach((letter, i)=>{
    const c = document.createElement("div");
    c.className = "memory-card";
    c.dataset.letter = letter; c.dataset.i = i;
    c.textContent = "?";
    c.onclick = ()=>{
      if(c.classList.contains("flipped") || c.classList.contains("matched")) return;
      if(typingState.flipped.length >= 2) return;
      c.classList.add("flipped"); c.textContent = letter;
      birdChu();
      speak(letter, "en-IN");
      typingState.flipped.push(c);
      if(typingState.flipped.length === 2){
        typingState.tries++;
        $("mTries").textContent = typingState.tries;
        const [a,b] = typingState.flipped;
        if(a.dataset.letter === b.dataset.letter){
          a.classList.add("matched"); b.classList.add("matched");
          typingState.matched++;
          $("mMatched").textContent = typingState.matched;
          sparkle();
          const r = a.getBoundingClientRect();
          burst(r.left+r.width/2, r.top, 25);
          safeTimeout(()=>{
            a.classList.remove("flipped"); b.classList.remove("flipped");
            typingState.flipped = [];
          }, 300);
          if(typingState.matched === 8){
            safeTimeout(()=>winTyping(isHi?"🃏 सब जोड़े मिल गए!":"🃏 All pairs matched!"), 500);
          }
        } else {
          gentleTry();
          safeTimeout(()=>{
            a.classList.remove("flipped"); b.classList.remove("flipped");
            a.textContent = "?"; b.textContent = "?";
            typingState.flipped = [];
          }, 900);
        }
      }
    };
    grid.appendChild(c);
  });
}
